      <script>
      // 2026-11-28 加：引擎重启后自动重连，不用手动刷新。
      // 做法：每 2 秒探一次同源 /manifest.webmanifest（静态小文件，不吃引擎状态）；
      // 连续 2 次拿不到（引擎正在重启）→ 之后一旦恢复，自动 location.reload() 一次。
      (function () {
        var miss = 0, reloading = false;
        function probe() {
          fetch('./manifest.webmanifest?ping=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              if (!r.ok) throw new Error('bad');
              if (miss >= 2 && !reloading) {
                reloading = true;
                location.reload();
              }
              miss = 0;
            })
            .catch(function () {
              miss += 1;
            });
        }
        setInterval(probe, 2000);
      })();
    </script>
